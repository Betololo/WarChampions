html/head_include="<script src=\"coi-serviceworker.js\"></script><style>html,body,#canvas{margin:0;padding:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#0f1724;user-select:none;}</style><script>(function(){const LOCKED_KEYS=['KeyW','KeyA','KeyS','KeyD','KeyR','KeyT','KeyQ','KeyE','KeyF','KeyG','KeyN','KeyZ','KeyX','KeyC','KeyV','KeyB','F1','F2','F3','F4','Tab'];function lockKb(){if(navigator.keyboard&&typeof navigator.keyboard.lock==='function'){navigator.keyboard.lock(LOCKED_KEYS).catch(()=>{});}}const orig=Element.prototype.requestPointerLock;if(orig){Element.prototype.requestPointerLock=function(opts){const el=this;const callOrig=()=>{try{const p=orig.call(el,Object.assign({unadjustedMovement:true},opts||{}));if(p&&typeof p.catch==='function'){p.catch(()=>orig.call(el));}return p;}catch(e){return orig.call(el);}};lockKb();if(!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen({navigationUI:'hide'}).then(()=>{lockKb();if(document.pointerLockElement!==el){callOrig();}}).catch(()=>{});}return callOrig();};}document.addEventListener('fullscreenchange',lockKb);document.addEventListener('pointerlockchange',lockKb);window.addEventListener('beforeunload',function(e){if(!window.__coiReloading){e.preventDefault();e.returnValue='';return '';}});window.addEventListener('contextmenu',function(e){e.preventDefault();},{capture:true});window.addEventListener('keydown',function(e){const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA'){return;}if(e.ctrlKey||e.metaKey||e.altKey||/^F([1-9]|1[0-2])$/.test(e.key)||e.key==='Tab'){e.preventDefault();}},{capture:true,passive:false});})();</script>"
